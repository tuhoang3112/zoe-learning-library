<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UTM Builder | Zoe</title>
<style>
  :root{
    --blue:#BAD2FF; --blue-dark:#5D79A8; --blue-light:#F2F6FF;
    --ink:#111827; --muted:#667085; --line:#E4E7EC; --paper:#FCFCFD; --warn:#B54708;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  .wrap{width:min(760px,calc(100% - 32px));margin:0 auto;padding:48px 0 80px}
  .eyebrow{color:var(--blue-dark);font-size:12px;text-transform:uppercase;letter-spacing:.12em;font-weight:800}
  h1{font-size:34px;letter-spacing:-.04em;margin:10px 0 8px}
  .sub{color:var(--muted);margin:0 0 28px;line-height:1.6}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .field{margin-bottom:16px}
  label{display:block;font-size:12px;font-weight:700;color:#475467;margin-bottom:6px}
  .hint{font-weight:400;color:#98A2B3}
  input,select{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;font-size:14px;background:#fff;color:var(--ink)}
  input:focus,select:focus{outline:3px solid rgba(93,121,168,.25);border-color:var(--blue)}
  input[readonly]{background:#F5F7FA;color:#475467;cursor:not-allowed}
  .types{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
  .types button{padding:12px 10px;text-align:center;line-height:1.35}
  .types button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .types small{display:block;font-weight:400;opacity:.75;font-size:11px;margin-top:2px}
  .note{background:var(--blue-light);border-radius:10px;padding:10px 12px;font-size:13px;color:#344054;margin-bottom:16px;line-height:1.5}
  .result{margin-top:8px;background:var(--blue-light);border-radius:14px;padding:18px}
  .result-label{font-size:12px;font-weight:800;color:var(--blue-dark);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
  .url{word-break:break-all;font-size:14px;line-height:1.6;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;min-height:48px}
  .actions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
  button{font:inherit;font-size:14px;font-weight:800;border-radius:10px;padding:11px 18px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--blue-dark)}
  button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
  button:hover{filter:brightness(.97)}
  .warn{color:var(--warn);font-size:13px;margin-top:10px;line-height:1.5}
  h2{font-size:18px;margin:32px 0 12px;letter-spacing:-.02em}
  .hist{list-style:none;padding:0;margin:0;display:grid;gap:8px}
  .hist li{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:center;justify-content:space-between}
  .hist span{word-break:break-all;color:#475467}
  .hist button{padding:6px 10px;font-size:12px;flex-shrink:0}
  .empty{color:#98A2B3;font-size:13px}
  @media(max-width:560px){.row{grid-template-columns:1fr}.types{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Công cụ nội bộ</div>
  <h1>UTM Builder</h1>
  <p class="sub">Chọn loại trang đích, dán link (không nhất thiết là trang chủ), điền các ô. Chữ tự chuyển thành chữ thường, bỏ dấu, dấu cách thành dấu gạch ngang.</p>

  <div class="card">
    <div class="types" id="types">
      <button type="button" data-type="tm">Tomorrow Marketers<small>medium và campaign cố định</small></button>
      <button type="button" data-type="substack">Substack<small>trang chủ hoặc bài bất kỳ</small></button>
      <button type="button" data-type="library">Learning Library<small>trang chủ hoặc link có bộ lọc</small></button>
    </div>

    <div class="note" id="typeNote"></div>

    <div class="field">
      <label for="url">Link đích <span class="hint" id="urlHint"></span></label>
      <input id="url" type="url" placeholder="https://...">
    </div>

    <div class="row">
      <div class="field">
        <label for="source">utm_source <span class="hint">nơi bạn đăng link</span></label>
        <input id="source" list="sources" placeholder="linkedin">
        <datalist id="sources"><option value="linkedin"><option value="substack"><option value="facebook"><option value="zalo"><option value="youtube"><option value="email"><option value="threads"><option value="learning-library"></datalist>
      </div>
      <div class="field">
        <label for="medium">utm_medium <span class="hint" id="mediumHint">loại kênh</span></label>
        <input id="medium" list="mediums" placeholder="social">
        <datalist id="mediums"><option value="social"><option value="email"><option value="referral"><option value="video"></datalist>
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label for="campaign">utm_campaign <span class="hint" id="campaignHint">chủ đề hoặc series</span></label>
        <input id="campaign" placeholder="learn-ai-from-0">
      </div>
      <div class="field">
        <label for="content">utm_content <span class="hint">không bắt buộc, ví dụ ngày đăng</span></label>
        <input id="content" placeholder="2026-09-25">
      </div>
    </div>

    <div class="result">
      <div class="result-label">Link của bạn</div>
      <div class="url" id="out" aria-live="polite"></div>
      <div class="actions">
        <button class="primary" id="copy">Sao chép link</button>
        <button id="reset">Xóa các ô</button>
      </div>
      <div class="warn" id="warn" hidden></div>
    </div>
  </div>

  <h2>Link đã tạo gần đây</h2>
  <ul class="hist" id="hist"></ul>
</div>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var urlEl=$("url"),out=$("out"),warn=$("warn"),hist=$("hist");
  var fields=["source","medium","campaign","content"];
  var KEY="zoe-utm-builder-v2";

  var TYPES={
    tm:{
      note:"Link sang trang của Tomorrow Marketers. Theo quy tắc, utm_medium = service và utm_campaign = hct luôn cố định. utm_source mặc định là learning-library, đổi nếu bạn đăng ở kênh khác.",
      hint:"trang bất kỳ của tomorrowmarketers.org",
      placeholder:"https://www.tomorrowmarketers.org/data-analysis-course",
      host:/(^|\.)tomorrowmarketers\.org$/,
      hostName:"tomorrowmarketers.org",
      defUrl:"",
      lock:{medium:"service",campaign:"hct"},
      defSource:"learning-library"
    },
    substack:{
      note:"Link sang Substack của bạn. Dán trang chủ hoặc link một bài cụ thể.",
      hint:"trang chủ hoặc bài của zoedatalens.substack.com",
      placeholder:"https://zoedatalens.substack.com/p/ten-bai",
      host:/^zoedatalens\.substack\.com$/,
      hostName:"zoedatalens.substack.com",
      defUrl:"https://zoedatalens.substack.com/",
      lock:null,defSource:""
    },
    library:{
      note:"Link sang Learning Library. Dán trang chủ hoặc link đã có bộ lọc, ví dụ ?topic=Data%20Analytics.",
      hint:"trang chủ hoặc link có bộ lọc của tuhoang3112.github.io",
      placeholder:"https://tuhoang3112.github.io/zoe-learning-library/?topic=Data%20Analytics",
      host:/^tuhoang3112\.github\.io$/,
      hostName:"tuhoang3112.github.io",
      defUrl:"https://tuhoang3112.github.io/zoe-learning-library/",
      lock:null,defSource:""
    }
  };
  var state={type:"library",urls:{},vals:{}};

  function clean(v){
    return v.trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d").replace(/[^a-z0-9_-]+/g,"-").replace(/^-+|-+$/g,"");
  }
  function cfg(){return TYPES[state.type]}

  function applyType(fromUser){
    var c=cfg();
    document.querySelectorAll("#types button").forEach(function(b){b.classList.toggle("on",b.getAttribute("data-type")===state.type)});
    $("typeNote").textContent=c.note;
    $("urlHint").textContent=c.hint;
    urlEl.placeholder=c.placeholder;
    urlEl.value=state.urls[state.type]!==undefined?state.urls[state.type]:c.defUrl;
    var lock=c.lock;
    ["medium","campaign"].forEach(function(f){
      var el=$(f);
      if(lock){el.value=lock[f];el.readOnly=true}
      else{el.readOnly=false;if(fromUser&&(el.value===TYPES.tm.lock[f]))el.value=""}
    });
    $("mediumHint").textContent=lock?"cố định":"loại kênh";
    $("campaignHint").textContent=lock?"cố định":"chủ đề hoặc series";
    if(fromUser&&c.defSource&&!$("source").value)$("source").value=c.defSource;
    if(fromUser&&!c.defSource&&$("source").value===TYPES.tm.defSource)$("source").value="";
  }

  function build(){
    var c=cfg(),msgs=[],base=urlEl.value.trim();
    if(!base){out.textContent="Dán link đích ở trên.";warn.hidden=true;return null}
    var u;
    try{u=new URL(base)}catch(e){out.textContent="Link đích chưa hợp lệ (cần bắt đầu bằng https://).";warn.hidden=true;return null}
    var vals={};
    fields.forEach(function(f){vals[f]=clean($(f).value)});
    if(!vals.source||!vals.medium||!vals.campaign){
      out.textContent="Điền đủ source, medium và campaign để tạo link.";warn.hidden=true;return null;
    }
    if(!c.host.test(u.hostname))msgs.push("Link đích không thuộc "+c.hostName+". Kiểm tra lại loại trang đích đã chọn.");
    if(/(^|&)utm_/.test(u.search.replace(/^\?/,"")))msgs.push("Link đích đã có UTM, các tham số UTM cũ được thay bằng giá trị mới.");
    fields.forEach(function(f){
      if(vals[f])u.searchParams.set("utm_"+f,vals[f]);else u.searchParams.delete("utm_"+f);
    });
    warn.hidden=!msgs.length;warn.textContent=msgs.join(" ");
    out.textContent=u.toString();
    return u.toString();
  }

  function save(){
    state.urls[state.type]=urlEl.value;
    state.vals={};fields.forEach(function(f){state.vals[f]=$(f).value});
    try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}
  }
  function load(){
    try{
      var d=JSON.parse(localStorage.getItem(KEY)||"null");
      if(!d)return;
      state.type=TYPES[d.type]?d.type:"library";state.urls=d.urls||{};
      fields.forEach(function(f){$(f).value=(d.vals&&d.vals[f])||""});
    }catch(e){}
  }
  function getHist(){try{return JSON.parse(localStorage.getItem(KEY+"-hist")||"[]")}catch(e){return[]}}
  function setHist(h){try{localStorage.setItem(KEY+"-hist",JSON.stringify(h.slice(0,10)))}catch(e){}}
  function renderHist(){
    var h=getHist();hist.innerHTML="";
    if(!h.length){var li=document.createElement("li");li.className="empty";li.textContent="Chưa có link nào.";hist.appendChild(li);return}
    h.forEach(function(url){
      var li=document.createElement("li"),s=document.createElement("span"),b=document.createElement("button");
      s.textContent=url;b.textContent="Sao chép";
      b.onclick=function(){copyText(url,b)};
      li.appendChild(s);li.appendChild(b);hist.appendChild(li);
    });
  }
  function copyText(t,btn){
    var done=function(){var o=btn.textContent;btn.textContent="Đã sao chép";setTimeout(function(){btn.textContent=o},1400)};
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,function(){fallback(t,done)})}else fallback(t,done);
  }
  function fallback(t,done){var ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");done()}catch(e){}document.body.removeChild(ta)}

  document.querySelectorAll("#types button").forEach(function(b){
    b.onclick=function(){
      state.urls[state.type]=urlEl.value;
      state.type=b.getAttribute("data-type");
      applyType(true);build();save();
    };
  });
  $("copy").onclick=function(){
    var url=build();if(!url)return;
    copyText(url,$("copy"));
    var h=getHist().filter(function(x){return x!==url});h.unshift(url);setHist(h);renderHist();
  };
  $("reset").onclick=function(){
    var lock=cfg().lock;
    fields.forEach(function(f){if(!(lock&&lock[f]))$(f).value=""});
    if(cfg().defSource)$("source").value=cfg().defSource;
    urlEl.value=cfg().defUrl;save();build();
  };
  [urlEl].concat(fields.map($)).forEach(function(el){el.addEventListener("input",function(){build();save()})});

  load();applyType(false);
  if(cfg().lock){fields.forEach(function(f){if(cfg().lock[f])$(f).value=cfg().lock[f]})}
  if(cfg().defSource&&!$("source").value)$("source").value=cfg().defSource;
  build();renderHist();
})();
</script>
</body>
</html>
